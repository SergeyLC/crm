name: Deploy Application

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Override deployment type (leave empty to use environment variable)'
        required: false
      force_deploy:
        description: 'Force deployment even if conditions not met'
        required: false
        default: 'false'
      version:
        description: 'Version to deploy (for manual release creation)'
        required: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ==================== Run Tests ====================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.force_deploy != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests
        uses: ./.github/actions/run-tests

  # ==================== Determine Environment & Type ====================
  setup:
    name: Setup Deployment Configuration
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    outputs:
      environment: ${{ steps.setup.outputs.environment }}
      deployment_type: ${{ steps.setup.outputs.deployment_type }}
      should_deploy: ${{ steps.setup.outputs.should_deploy }}
      image_tag: ${{ steps.setup.outputs.image_tag }}
      version: ${{ steps.setup.outputs.version }}
      is_release: ${{ steps.setup.outputs.is_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment
        id: setup
        uses: ./.github/actions/setup-deployment
        with:
          deployment_type_override: ${{ github.event.inputs.deployment_type }}
          deployment_type_default: ${{ vars.DEPLOYMENT_TYPE || 'docker' }}

      - name: Output deployment configuration
        run: |
          echo "🚀 Deployment Configuration:"
          echo "Environment: ${{ steps.setup.outputs.environment }}"
          echo "Deployment Type: ${{ steps.setup.outputs.deployment_type }}"
          echo "Should Deploy: ${{ steps.setup.outputs.should_deploy }}"
          echo "Image Tag: ${{ steps.setup.outputs.image_tag }}"
          echo "Version: ${{ steps.setup.outputs.version }}"
          echo "Is Release: ${{ steps.setup.outputs.is_release }}"
          echo ""
          echo "🔍 Debug - Raw outputs for job context:"
          echo "environment='${{ steps.setup.outputs.environment }}'"
          echo "deployment_type='${{ steps.setup.outputs.deployment_type }}'"
          echo "should_deploy='${{ steps.setup.outputs.should_deploy }}'"
          echo "image_tag='${{ steps.setup.outputs.image_tag }}'"
          echo ""
          echo "✅ Setup job completed successfully"
          echo "Exit code: $?"

  check-setup:
    name: Check Setup Outputs
    runs-on: ubuntu-latest
    needs: setup
    if: always()
    steps:
      - name: Output setup job results
        run: |
          echo "🔍 Checking setup job outputs:"
          echo "Environment: ${{ needs.setup.outputs.environment }}"
          echo "Deployment Type: ${{ needs.setup.outputs.deployment_type }}"
          echo "Should Deploy: ${{ needs.setup.outputs.should_deploy }}"
          echo "Image Tag: ${{ needs.setup.outputs.image_tag }}"
          echo "Version: ${{ needs.setup.outputs.version }}"
          echo "Is Release: ${{ needs.setup.outputs.is_release }}"
          echo ""
          echo "🔍 Additional debugging for conditions:"
          echo "Type of should_deploy: ${{ toJSON(needs.setup.outputs.should_deploy) }}"
          echo "Type of deployment_type: ${{ toJSON(needs.setup.outputs.deployment_type) }}"

  # ==================== Docker Deployment ====================
  deploy-docker:
    name: Deploy with Docker
    runs-on: ubuntu-latest
    needs: setup
    # Simplified condition for testing - will check values in debug step
    if: always()
    # Environment is properly configured in GitHub Settings with secrets
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Debug deployment conditions
        run: |
          echo "🔍 Checking deployment conditions:"
          echo "should_deploy = '${{ needs.setup.outputs.should_deploy }}'"
          echo "deployment_type = '${{ needs.setup.outputs.deployment_type }}'"
          echo "environment = '${{ needs.setup.outputs.environment }}'"
          echo ""
          echo "🔍 Checking required inputs for docker-deploy action:"
          echo "image_tag: '${{ needs.setup.outputs.image_tag }}'"
          echo "version: '${{ needs.setup.outputs.version }}'"
          echo "server_host exists: ${{ secrets.SERVER_HOST != '' }}"
          echo "postgres_db: '${{ secrets.POSTGRES_DB }}'"
          echo "postgres_user: '${{ secrets.POSTGRES_USER }}'"
          echo "postgres_password exists: ${{ secrets.POSTGRES_PASSWORD != '' }}"
          echo "jwt_secret exists: ${{ secrets.JWT_SECRET != '' }}"
          echo ""
          echo "🔍 Will test if action can be called..."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker
        uses: ./.github/actions/docker-deploy
        with:
          environment: ${{ needs.setup.outputs.environment }}
          image_tag: ${{ needs.setup.outputs.image_tag }}
          version: ${{ needs.setup.outputs.version }}
          server_host: ${{ secrets.SERVER_HOST }}
          server_user: ${{ secrets.SERVER_USER }}
          server_ssh_key: ${{ secrets.SERVER_SSH_KEY }}
          postgres_db: ${{ secrets.POSTGRES_DB || 'loyacrm_staging' }}
          postgres_user: ${{ secrets.POSTGRES_USER || 'loyacrm' }}
          postgres_password: ${{ secrets.POSTGRES_PASSWORD || 'CHANGE_ME' }}
          jwt_secret: ${{ secrets.JWT_SECRET || 'CHANGE_ME_JWT_SECRET' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ==================== Traditional Deployment ====================
  deploy-traditional:
    name: Deploy Traditionally
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.should_deploy == 'true' && needs.setup.outputs.deployment_type == 'traditional'
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy traditionally
        uses: ./.github/actions/traditional-deploy
        with:
          environment: ${{ needs.setup.outputs.environment }}

  # ==================== Create GitHub Release (after successful deploy) ====================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [setup, deploy-docker]
    if: needs.setup.outputs.is_release == 'true' && needs.deploy-docker.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Release version: ${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}

            This is an automated production release with Docker deployment.

            ### Deployment
            - **Environment:** Production
            - **Server:** ${{ secrets.SERVER_HOST }}
            - **Port:** 80

            ### Docker Images
            - Frontend: `ghcr.io/${{ github.repository }}/frontend:${{ needs.setup.outputs.image_tag }}`
            - Backend: `ghcr.io/${{ github.repository }}/backend:${{ needs.setup.outputs.image_tag }}`

            ### Status
            - ✅ Docker images built and pushed
            - ✅ Production deployment completed
            - ✅ Services healthy and running

            See commit history for detailed changes.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
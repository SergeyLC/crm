      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy with Docker
        uses: ./.github/actions/docker-deploy
        with:
          environment: ${{ needs.setup.outputs.environment }}
          image_tag: ${{ needs.setup.outputs.image_tag }}
          version: ${{ needs.setup.outputs.version }}
          server_host: ${{ secrets.SERVER_HOST }}
          server_user: ${{ secrets.SERVER_USER }}
          server_ssh_key: ${{ secrets.SERVER_SSH_KEY }}
          postgres_db: ${{ secrets.POSTGRES_DB }}
          postgres_user: ${{ secrets.POSTGRES_USER }}
          postgres_password: ${{ secrets.POSTGRES_PASSWORD }}
          jwt_secret: ${{ secrets.JWT_SECRET }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_seed: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_seed == 'true' && 'true' || 'false' }}

  # ==================== Traditional Deployment ====================
  deploy-traditional:
    name: Deploy Traditionally
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.should_deploy == 'true' && needs.setup.outputs.deployment_type == 'traditional'
    environment: ${{ needs.setup.outputs.environment }}
    # OPTIONAL: one deploy per environment at a time
    concurrency:
      group: deploy-${{ needs.setup.outputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Validate required secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          TARGET_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          # Fail fast: names only, values are never printed.
          missing=0
          for name in SERVER_HOST SERVER_USER SERVER_SSH_KEY; do
            if [ -z "$(printf '%s' "${!name}" | tr -d '[:space:]')" ]; then
              echo "::error title=Missing secret::Required secret '${name}' is not set (or empty) for environment '${TARGET_ENV}'"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "✅ All required secrets are present for '${TARGET_ENV}'"
        shell: bash

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy traditionally
        uses: ./.github/actions/traditional-deploy
        with:
          environment: ${{ needs.setup.outputs.environment }}
          server_host: ${{ secrets.SERVER_HOST }}
          server_user: ${{ secrets.SERVER_USER }}
          server_ssh_key: ${{ secrets.SERVER_SSH_KEY }}

  # ==================== Create GitHub Release (after successful deploy) ====================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [setup, deploy-docker]
    if: needs.setup.outputs.is_release == 'true' && needs.deploy-docker.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Release version: ${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Release ${{ steps.version.outputs.version }}

            This is an automated production release with Docker deployment.

            ### Deployment
            - **Environment:** Production
            - **Port:** 80

            ### Docker Images
            - Frontend: `ghcr.io/${{ github.repository }}/frontend:${{ needs.setup.outputs.image_tag }}`
            - Backend: `ghcr.io/${{ github.repository }}/backend:${{ needs.setup.outputs.image_tag }}`

            ### Status
            - ✅ Docker images built and pushed
            - ✅ Production deployment completed
            - ✅ Services healthy and running

            See commit history for detailed changes.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

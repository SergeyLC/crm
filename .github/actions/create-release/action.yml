name: 'Create Release'
description: 'Create a new release with version increment'

inputs:
  tag_name:
    description: 'Tag name for the release'
    required: true
  github_token:
    description: 'GitHub token for authentication'
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ inputs.github_token }}

    - name: Check if tag is on main
      run: |
        # Check if the current commit (tag) is in main branch
        if git merge-base --is-ancestor ${{ github.sha }} origin/main 2>/dev/null; then
          echo "Tag is on main branch, proceeding with release"
        else
          echo "Tag not on main branch, skipping release"
          exit 1
        fi
      shell: bash

    - name: Extract version from tag
      id: get_version
      run: |
        # Remove 'refs/tags/' and 'v' prefix from tag
        VERSION="${{ inputs.tag_name }}"
        VERSION="${VERSION#refs/tags/}"  # Remove refs/tags/
        VERSION="${VERSION#v}"            # Remove v prefix
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "📦 Release version: ${VERSION}"
      shell: bash

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Update package.json version
      run: |
        # Update frontend/package.json version
        node -e "
        const fs = require('fs');
        const pkg = require('./frontend/package.json');
        pkg.version = '${{ steps.get_version.outputs.version }}';
        fs.writeFileSync('frontend/package.json', JSON.stringify(pkg, null, 2) + '\n');
        "
        echo "✅ Updated frontend/package.json to version ${{ steps.get_version.outputs.version }}"
      shell: bash

    - name: Commit version update
      run: |
        # For tag-based releases, we don't commit back to main
        # The version in package.json is just for the release artifact
        echo "ℹ️  Skipping commit for tag-based release"
        echo "Version update is for release artifacts only"
      shell: bash

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.tag_name }}
        name: Release ${{ steps.get_version.outputs.version }}
        body: |
          ## Release ${{ steps.get_version.outputs.version }}

          This is an automated production release with Docker deployment.

          ### Deployment
          - **Environment:** Production
          - **Type:** Docker (containerized)
          - **Images:** Available on GitHub Container Registry

          ### Changes
          See commit history for detailed changes.

          ### Deployment Status
          - ✅ Docker images built and pushed
          - ✅ Production deployment completed
          - ✅ Database migrations applied
          - ✅ Health checks passed
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}

outputs:
  version:
    description: 'The release version'
    value: ${{ steps.get_version.outputs.version }}
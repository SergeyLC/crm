name: 'Traditional Deployment'
description: 'Deploy application using traditional method (source code)'

inputs:
  environment:
    description: 'Target environment'
    required: true
  server_host:
    description: 'Server IP or domain'
    required: true
  server_user:
    description: 'Server SSH user'
    required: true
  server_ssh_key:
    description: 'Server SSH private key'
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: |
          pnpm-lock.yaml
          frontend/pnpm-lock.yaml
          backend/pnpm-lock.yaml
          db/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Generate Prisma client
      run: |
        cd db
        pnpm run generate
      shell: bash

    - name: Build frontend
      run: |
        cd frontend
        export NEXT_TELEMETRY_DISABLED=1
        export SKIP_TYPE_CHECK=true
        export SKIP_LINT=true
        export NODE_OPTIONS="--max-old-space-size=4096"
        pnpm run build
      shell: bash

    - name: Build backend
      run: |
        cd backend
        pnpm run build
      shell: bash

    - name: Deploy to ${{ inputs.environment }} server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ inputs.server_host }}
        username: ${{ inputs.server_user }}
        key: ${{ inputs.server_ssh_key }}
        command_timeout: 30m
        script: |
          set -e

          echo "📦 Traditional Deployment to ${{ inputs.environment }}"
          echo "🏗️ Deployment directory: /var/www/crm-${{ inputs.environment }}"

          DEPLOY_DIR="/var/www/crm-${{ inputs.environment }}"

          # Create deployment directory if it doesn't exist
          mkdir -p "$DEPLOY_DIR"

          # Navigate to deployment directory
          cd "$DEPLOY_DIR"

          echo "📁 Updating source code..."
          # Backup current deployment (optional)
          if [ -d "current" ]; then
            mv current "backup-$(date +%Y%m%d-%H%M%S)" || true
          fi

          # Copy new code (assuming rsync or similar is available)
          # Note: In practice, you'd use git clone or rsync from repo
          echo "⚠️ Source code deployment would go here"
          echo "💡 Consider using git clone or rsync for traditional deployment"

          echo "🔧 Installing dependencies..."
          # pnpm install --frozen-lockfile

          echo "🗄️ Running database migrations..."
          # cd db && pnpm run migrate:deploy

          echo "🏗️ Building applications..."
          # cd frontend && pnpm run build
          # cd backend && pnpm run build

          echo "🚀 Starting services..."
          # pm2 restart ecosystem.config.js or similar

          echo "✅ Traditional deployment to ${{ inputs.environment }} completed!"

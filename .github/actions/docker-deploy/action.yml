name: 'Docker Deployment'
description: 'Deploy application using Docker containers'

inputs:
  environment:
    description: 'Target environment'
    required: true
  image_tag:
    description: 'Docker image tag to deploy'
    required: true
  version:
    description: 'Application version'
    required: true
  server_host:
    description: 'Server IP or domain'
    required: true
  postgres_db:
    description: 'PostgreSQL database name'
    required: true
  postgres_user:
    description: 'PostgreSQL user'
    required: true
  postgres_password:
    description: 'PostgreSQL password'
    required: true
  jwt_secret:
    description: 'JWT secret'
    required: true
  github_token:
    description: 'GitHub token for registry access'
    required: true
  server_user:
    description: 'Server SSH user'
    required: true
  server_ssh_key:
    description: 'Server SSH private key'
    required: true
  run_seed:
    description: 'After migrate, run db seed:runtime'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Debug inputs
      run: |
        echo "🔍 Docker Deploy Inputs:"
        echo "Environment: ${{ inputs.environment }}"
        echo "Image tag: ${{ inputs.image_tag }}"
        echo "Version: ${{ inputs.version }}"
      shell: bash

    - name: Mask secret-derived values
      env:
        IN_POSTGRES_USER: ${{ inputs.postgres_user }}
        IN_POSTGRES_PASSWORD: ${{ inputs.postgres_password }}
        IN_POSTGRES_DB: ${{ inputs.postgres_db }}
        IN_JWT_SECRET: ${{ inputs.jwt_secret }}
        IN_SERVER_HOST: ${{ inputs.server_host }}
      run: |
        # Raw secrets are masked by GitHub; also mask the CR/LF-stripped variants
        # and the composed DATABASE_URL, which GitHub cannot know about.
        strip_ws() { printf '%s' "$1" | tr -d '\r\n'; }
        for v in "$IN_POSTGRES_PASSWORD" "$IN_JWT_SECRET" "$IN_SERVER_HOST"; do
          sv=$(strip_ws "$v")
          [ -n "$sv" ] && echo "::add-mask::${sv}"
        done
        DB_URL="postgresql://$(strip_ws "$IN_POSTGRES_USER"):$(strip_ws "$IN_POSTGRES_PASSWORD")@"
        echo "::add-mask::${DB_URL}"
      shell: bash

    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Generate build version
      id: version
      run: |
        if [[ "${{ inputs.environment }}" == "production" ]]; then
          BUILD_VERSION="${{ inputs.version }}"
        else
          STABLE_VERSION="${{ inputs.version }}"
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_VERSION="${STABLE_VERSION}+sha.${COMMIT_HASH}"
        fi

        echo "BUILD_VERSION=${BUILD_VERSION}" >> $GITHUB_OUTPUT
        echo "📦 Version: ${BUILD_VERSION}"
      shell: bash

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: |
          pnpm-lock.yaml
          frontend/pnpm-lock.yaml
          backend/pnpm-lock.yaml
          db/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Generate Prisma client
      run: |
        cd db
        pnpm run generate
      shell: bash

    - name: Build frontend
      run: |
        cd frontend
        export NEXT_TELEMETRY_DISABLED=1
        export SKIP_TYPE_CHECK=true
        export SKIP_LINT=true
        export NODE_OPTIONS="--max-old-space-size=4096"
        pnpm run build
      shell: bash

    - name: Build backend
      run: |
        cd backend
        pnpm run build
      shell: bash

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Prepare repository name
      id: repo
      run: |
        # Convert repository name to lowercase for Docker
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "name=${REPO_LOWER}" >> $GITHUB_OUTPUT
        echo "📦 Repository: ${REPO_LOWER}"
      shell: bash

    - name: Extract metadata for frontend Docker image
      id: meta-frontend
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ steps.repo.outputs.name }}/frontend
        tags: |
          type=raw,value=${{ inputs.image_tag }}

    - name: Debug metadata outputs
      run: |
        echo "🔍 Metadata Debug:"
        echo "Frontend tags: ${{ steps.meta-frontend.outputs.tags }}"
        echo "Frontend version: ${{ steps.meta-frontend.outputs.version }}"
        echo "Input image_tag: ${{ inputs.image_tag }}"
      shell: bash

    - name: Extract metadata for backend Docker image
      id: meta-backend
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ steps.repo.outputs.name }}/backend
        tags: |
          type=raw,value=${{ inputs.image_tag }}

    - name: Build and push frontend Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docker/frontend/Dockerfile
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_VERSION=${{ steps.version.outputs.BUILD_VERSION }}
          NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.BUILD_VERSION }}

    - name: Build and push backend Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./docker/backend/Dockerfile
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_VERSION=${{ steps.version.outputs.BUILD_VERSION }}

    # Bundle compose/nginx + server deploy script + ci.env (secrets). The SSH key is
    # forced via authorized_keys to only mkdir/scp this path and run crm-ci-deploy.sh.
    - name: Prepare CI deploy bundle
      shell: bash
      env:
        DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        DEPLOY_IMAGE_TAG: ${{ inputs.image_tag }}
        DEPLOY_VERSION: ${{ inputs.version }}
        DEPLOY_SERVER_HOST: ${{ inputs.server_host }}
        DEPLOY_POSTGRES_DB: ${{ inputs.postgres_db }}
        DEPLOY_POSTGRES_USER: ${{ inputs.postgres_user }}
        DEPLOY_POSTGRES_PASSWORD: ${{ inputs.postgres_password }}
        DEPLOY_JWT_SECRET: ${{ inputs.jwt_secret }}
        DEPLOY_GITHUB_TOKEN: ${{ inputs.github_token }}
        DEPLOY_GITHUB_ACTOR: ${{ github.actor }}
        DEPLOY_GITHUB_REPOSITORY: ${{ github.repository }}
        DEPLOY_RUN_ID: ${{ github.run_id }}
        DEPLOY_RUN_SEED: ${{ inputs.run_seed }}
      run: |
        set -euo pipefail
        cp scripts/server/crm-ci-deploy.sh ./crm-ci-deploy.sh
        chmod 755 ./crm-ci-deploy.sh
        umask 077
        : > ci.env
        for key in \
          DEPLOY_ENVIRONMENT DEPLOY_IMAGE_TAG DEPLOY_VERSION DEPLOY_SERVER_HOST \
          DEPLOY_POSTGRES_DB DEPLOY_POSTGRES_USER DEPLOY_POSTGRES_PASSWORD DEPLOY_JWT_SECRET \
          DEPLOY_GITHUB_TOKEN DEPLOY_GITHUB_ACTOR DEPLOY_GITHUB_REPOSITORY \
          DEPLOY_RUN_ID DEPLOY_RUN_SEED
        do
          # Strip CR/LF; write KEY=value (no shell-eval on server beyond controlled parser)
          val="$(printf '%s' "${!key}" | tr -d '\r\n')"
          printf '%s=%s\n' "$key" "$val" >> ci.env
        done
        echo "Prepared crm-ci-deploy.sh + ci.env for run ${DEPLOY_RUN_ID}"

    - name: Copy deployment files to server
      shell: bash
      env:
        SERVER_HOST: ${{ inputs.server_host }}
        SERVER_USER: ${{ inputs.server_user }}
        SERVER_SSH_KEY: ${{ inputs.server_ssh_key }}
        DEPLOY_RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        KEY_FILE="$(mktemp)"
        trap 'rm -f "$KEY_FILE"' EXIT
        printf '%s\n' "$SERVER_SSH_KEY" >"$KEY_FILE"
        chmod 600 "$KEY_FILE"
        REMOTE_DIR="/tmp/crm-deploy-${DEPLOY_RUN_ID}"
        SSH_OPTS=(-i "$KEY_FILE" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
        ssh "${SSH_OPTS[@]}" "${SERVER_USER}@${SERVER_HOST}" "mkdir -p ${REMOTE_DIR}"
        scp "${SSH_OPTS[@]}" \
          docker-compose.yml \
          docker-compose.production.yml \
          docker-compose.stage.yml \
          docker-compose.stage-main.yml \
          docker-compose.stage-develop.yml \
          nginx.conf \
          nginx.stage.conf \
          nginx.stage-main.conf \
          nginx.prod.conf \
          nginx.stage-develop.conf \
          crm-ci-deploy.sh \
          ci.env \
          "${SERVER_USER}@${SERVER_HOST}:${REMOTE_DIR}/"

    # Plain OpenSSH (not appleboy/ssh-action): forced authorized_keys command= allowlists
    # only this exact remote argv. appleboy wraps scripts in base64|bash and would bypass that.
    - name: Deploy to ${{ inputs.environment }} server
      shell: bash
      env:
        SERVER_HOST: ${{ inputs.server_host }}
        SERVER_USER: ${{ inputs.server_user }}
        SERVER_SSH_KEY: ${{ inputs.server_ssh_key }}
        DEPLOY_RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        KEY_FILE="$(mktemp)"
        trap 'rm -f "$KEY_FILE"' EXIT
        printf '%s\n' "$SERVER_SSH_KEY" >"$KEY_FILE"
        chmod 600 "$KEY_FILE"
        ssh -i "$KEY_FILE" \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=accept-new \
          -o ServerAliveInterval=30 \
          -o ServerAliveCountMax=60 \
          "${SERVER_USER}@${SERVER_HOST}" \
          "/bin/bash /tmp/crm-deploy-${DEPLOY_RUN_ID}/crm-ci-deploy.sh"
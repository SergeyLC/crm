name: 'Docker Deployment'
description: 'Deploy application using Docker containers'

inputs:
  environment:
    description: 'Target environment'
    required: true
  image_tag:
    description: 'Docker image tag to deploy'
    required: true
  version:
    description: 'Application version'
    required: true
  server_host:
    description: 'Server IP or domain'
    required: true
  postgres_db:
    description: 'PostgreSQL database name'
    required: true
  postgres_user:
    description: 'PostgreSQL user'
    required: true
  postgres_password:
    description: 'PostgreSQL password'
    required: true
  jwt_secret:
    description: 'JWT secret'
    required: true
  github_token:
    description: 'GitHub token for registry access'
    required: true
  server_user:
    description: 'Server SSH user'
    required: true
  server_ssh_key:
    description: 'Server SSH private key'
    required: true

runs:
  using: "composite"
  steps:
    - name: Debug inputs
      run: |
        echo "🔍 Docker Deploy Inputs:"
        echo "Environment: ${{ inputs.environment }}"
        echo "Image tag: ${{ inputs.image_tag }}"
        echo "Version: ${{ inputs.version }}"
        echo "Server host: ${{ inputs.server_host }}"
      shell: bash

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate build version
      id: version
      run: |
        if [[ "${{ inputs.environment }}" == "production" ]]; then
          BUILD_VERSION="${{ inputs.version }}"
        else
          STABLE_VERSION="${{ inputs.version }}"
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BUILD_VERSION="${STABLE_VERSION}+sha.${COMMIT_HASH}"
        fi

        echo "BUILD_VERSION=${BUILD_VERSION}" >> $GITHUB_OUTPUT
        echo "📦 Version: ${BUILD_VERSION}"
      shell: bash

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: |
          pnpm-lock.yaml
          frontend/pnpm-lock.yaml
          backend/pnpm-lock.yaml
          db/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Generate Prisma client
      run: |
        cd db
        pnpm run generate
      shell: bash

    - name: Build frontend
      run: |
        cd frontend
        export NEXT_TELEMETRY_DISABLED=1
        export SKIP_TYPE_CHECK=true
        export SKIP_LINT=true
        export NODE_OPTIONS="--max-old-space-size=4096"
        pnpm run build
      shell: bash

    - name: Build backend
      run: |
        cd backend
        pnpm run build
      shell: bash

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Prepare repository name
      id: repo
      run: |
        # Convert repository name to lowercase for Docker
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "name=${REPO_LOWER}" >> $GITHUB_OUTPUT
        echo "📦 Repository: ${REPO_LOWER}"
      shell: bash

    - name: Extract metadata for frontend Docker image
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ steps.repo.outputs.name }}/frontend
        tags: |
          type=raw,value=${{ inputs.image_tag }}

    - name: Debug metadata outputs
      run: |
        echo "🔍 Metadata Debug:"
        echo "Frontend tags: ${{ steps.meta-frontend.outputs.tags }}"
        echo "Frontend version: ${{ steps.meta-frontend.outputs.version }}"
        echo "Input image_tag: ${{ inputs.image_tag }}"
      shell: bash

    - name: Extract metadata for backend Docker image
      id: meta-backend
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ steps.repo.outputs.name }}/backend
        tags: |
          type=raw,value=${{ inputs.image_tag }}

    - name: Build and push frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/frontend/Dockerfile
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_VERSION=${{ steps.version.outputs.BUILD_VERSION }}
          NEXT_PUBLIC_APP_VERSION=${{ steps.version.outputs.BUILD_VERSION }}

    - name: Build and push backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/backend/Dockerfile
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_VERSION=${{ steps.version.outputs.BUILD_VERSION }}

    - name: Copy deployment files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ inputs.server_host }}
        username: ${{ inputs.server_user }}
        key: ${{ inputs.server_ssh_key }}
        source: "docker-compose.yml,docker-compose.production.yml,docker-compose.stage.yml,docker-compose.stage-main.yml,docker-compose.stage-develop.yml,nginx.conf,nginx.stage.conf,nginx.stage-main.conf,nginx.prod.conf,nginx.stage-develop.conf"
        target: "/tmp/loyacrm-deploy-${{ github.run_id }}"
        strip_components: 0

    - name: Deploy to ${{ inputs.environment }} server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ inputs.server_host }}
        username: ${{ inputs.server_user }}
        key: ${{ inputs.server_ssh_key }}
        command_timeout: 30m
        script: |
          set -e

          echo "🐳 Docker Deployment to ${{ inputs.environment }}"
          echo "📦 Image tag: ${{ inputs.image_tag }}"
          
          # Determine deployment directory and compose file
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            DEPLOY_DIR="/var/www/loyacrm-production"
            COMPOSE_FILE="docker-compose.production.yml"
            NGINX_CONF="nginx.prod.conf"
            ENV_FILE=".env.production"
            CONTAINER_PREFIX="loyacrm-production"
          elif [[ "${{ inputs.environment }}" == "stage-develop" ]]; then
            DEPLOY_DIR="/var/www/loyacrm-stage-develop"
            COMPOSE_FILE="docker-compose.stage-develop.yml"
            NGINX_CONF="nginx.stage-develop.conf"
            ENV_FILE=".env.stage-develop"
            CONTAINER_PREFIX="loyacrm-stage-develop"
          elif [[ "${{ inputs.environment }}" == "stage-main" ]]; then
            DEPLOY_DIR="/var/www/loyacrm-stage-main"
            COMPOSE_FILE="docker-compose.stage-main.yml"
            NGINX_CONF="nginx.stage-main.conf"
            ENV_FILE=".env.stage-main"
            CONTAINER_PREFIX="loyacrm-stage-main"
          else
            # Fallback for old 'staging' environment name
            DEPLOY_DIR="/var/www/loyacrm-staging"
            COMPOSE_FILE="docker-compose.stage.yml"
            NGINX_CONF="nginx.stage.conf"
            ENV_FILE=".env.stage"
            CONTAINER_PREFIX="loyacrm-staging"
          fi

          echo "🏗️  Deployment directory: $DEPLOY_DIR"
          echo "📄 Compose file: $COMPOSE_FILE"
          echo "📄 Nginx config: $NGINX_CONF"
          echo "⚙️  Environment file: $ENV_FILE"

          # Create deployment directory if it doesn't exist
          mkdir -p "$DEPLOY_DIR"
          
          # Copy deployment files from temp location
          TEMP_DIR="/tmp/loyacrm-deploy-${{ github.run_id }}"
          echo "📦 Copying deployment files..."
          cp -f "$TEMP_DIR/$COMPOSE_FILE" "$DEPLOY_DIR/"
          cp -f "$TEMP_DIR/$NGINX_CONF" "$DEPLOY_DIR/nginx.conf"
          cp -f "$TEMP_DIR/nginx.conf" "$DEPLOY_DIR/" 2>/dev/null || true
          
          # Cleanup temp files
          rm -rf "$TEMP_DIR"

          # Navigate to deployment directory
          cd "$DEPLOY_DIR"

          # Determine port based on environment
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            # Production uses port 80
            PORT="80"
            BACKEND_URL="http://${{ inputs.server_host }}/api"
            CORS_ORIGIN="http://${{ inputs.server_host }}"
          elif [[ "${{ inputs.environment }}" == "stage-develop" ]]; then
            PORT="8081"
            BACKEND_URL="http://${{ inputs.server_host }}:8081/api"
            CORS_ORIGIN="http://${{ inputs.server_host }}:8081"
          else
            # stage-main uses port 8080
            PORT="8080"
            BACKEND_URL="http://${{ inputs.server_host }}:8080/api"
            CORS_ORIGIN="http://${{ inputs.server_host }}:8080"
          fi

          # Update or create environment file with secrets
          echo "⚙️  Configuring environment file..."
          
          # Recreate the env file from scratch to avoid issues with existing corrupted data
          rm -f "$ENV_FILE"
          touch "$ENV_FILE"
          
          # Convert repository name to lowercase for Docker
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          # Add Docker images
          echo "FRONTEND_IMAGE=ghcr.io/${REPO_LOWER}/frontend:${{ inputs.image_tag }}" >> "$ENV_FILE"
          echo "BACKEND_IMAGE=ghcr.io/${REPO_LOWER}/backend:${{ inputs.image_tag }}" >> "$ENV_FILE"
          
          # Add network configuration
          echo "NGINX_PORT=${PORT}" >> "$ENV_FILE"
          echo "DOMAIN=${{ inputs.server_host }}" >> "$ENV_FILE"
          
          # Add frontend configuration  
          echo "FRONTEND_PORT=3000" >> "$ENV_FILE"
          echo "NEXT_PUBLIC_API_URL=/api" >> "$ENV_FILE"
          echo "NEXT_PUBLIC_BACKEND_API_URL=${BACKEND_URL}" >> "$ENV_FILE"
          echo "NEXT_PUBLIC_APP_VERSION=${{ inputs.version }}" >> "$ENV_FILE"
          
          # Add backend configuration
          echo "BACKEND_PORT=4000" >> "$ENV_FILE"
          echo "NODE_ENV=production" >> "$ENV_FILE"
          echo "LOG_LEVEL=info" >> "$ENV_FILE"
          echo "CORS_ORIGIN=${CORS_ORIGIN}" >> "$ENV_FILE"
          
          # Add database configuration
          echo "POSTGRES_DB=${{ inputs.postgres_db }}" >> "$ENV_FILE"
          echo "POSTGRES_USER=${{ inputs.postgres_user }}" >> "$ENV_FILE"
          echo "POSTGRES_PASSWORD=${{ inputs.postgres_password }}" >> "$ENV_FILE"
          echo "DATABASE_URL=postgresql://${{ inputs.postgres_user }}:${{ inputs.postgres_password }}@${CONTAINER_PREFIX}-postgres:5432/${{ inputs.postgres_db }}" >> "$ENV_FILE"
          
          # Add JWT secret
          echo "JWT_SECRET=${{ inputs.jwt_secret }}" >> "$ENV_FILE"

          echo "✅ Environment configured with:"
          echo "   - Server: ${{ inputs.server_host }}:${PORT}"
          echo "   - Database: ${{ inputs.postgres_db }}"
          echo "   - Environment: ${{ inputs.environment }}"

          # Convert repository name to lowercase for Docker
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          echo "🐳 Pulling Docker images..."
          docker pull ghcr.io/${REPO_LOWER}/backend:${{ inputs.image_tag }}
          docker pull ghcr.io/${REPO_LOWER}/frontend:${{ inputs.image_tag }}

          echo "🗄️  Running database migrations..."
          docker exec ${CONTAINER_PREFIX}-backend sh -c 'cd /app/db && pnpm run migrate:deploy' || echo "⚠️  Migration failed or already up to date"

          echo "🐳 Restarting services with new images..."
          docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d --force-recreate --no-deps backend frontend

          echo "⏳ Waiting for services to be healthy..."
          sleep 10
          
          echo "✅ Checking service status..."
          docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" ps

          echo "🧹 Cleaning up old images..."
          docker image prune -f

          echo "✅ Docker deployment to ${{ inputs.environment }} completed!"
          echo "📊 Container status:"
          docker ps --filter "name=${CONTAINER_PREFIX}" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
services:
  # ==================== Nginx ====================
  nginx:
    image: nginx:alpine
    container_name: loyacrm-production-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks: [loyacrm-production-network]

  # ==================== Autoheal ====================
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: loyacrm-production-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=120
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [loyacrm-production-network]

  # ==================== Frontend ====================
  frontend:
    image: ${FRONTEND_IMAGE:-loyacrm-frontend:production}
    container_name: loyacrm-production-frontend
    restart: unless-stopped
    labels:
      - "autoheal=true"
    environment:
      - PORT=${FRONTEND_PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
      - NEXT_PUBLIC_BACKEND_API_URL=${NEXT_PUBLIC_BACKEND_API_URL}
      - NEXT_PUBLIC_APP_VERSION=${NEXT_PUBLIC_APP_VERSION:-production}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [loyacrm-production-network]

  # ==================== Backend ====================
  backend:
    image: ${BACKEND_IMAGE:-loyacrm-backend:production}
    container_name: loyacrm-production-backend
    restart: unless-stopped
    labels:
      - "autoheal=true"
    environment:
      - PORT=${BACKEND_PORT:-4000}
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-loyacrm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-loyacrm}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:${BACKEND_PORT:-4000}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [loyacrm-production-network]

  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: loyacrm-production-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER:-loyacrm}
      - POSTGRES_DB=${POSTGRES_DB:-loyacrm}
    volumes:
      - pg_data_production:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loyacrm}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [loyacrm-production-network]

# ==================== Volumes & Networks ====================
volumes:
  pg_data_production:
    name: loyacrm_pg_data_production

networks:
  loyacrm-production-network:
    driver: bridge

# ==================== Secrets ====================
secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt